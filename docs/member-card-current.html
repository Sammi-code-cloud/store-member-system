<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实际会员卡样式预览</title><style>*{box-sizing:border-box}body{margin:0;background:#ebe7e1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.preview{max-width:375px;margin:48px auto}.note{font-size:12px;color:#87776a;padding:0 16px;margin:0 0 16px;line-height:1.8}.page{padding:16px;background:#fff7ef}.title{text-align:center;font-size:16px;color:#392c26;padding:8px 0 24px}.card{margin-bottom:12px}.page>.card.member-card{position:relative;overflow:hidden;padding:19px 18px;border:0.5px solid #8e3b32;border-radius:16px;background:linear-gradient(115deg,#722c2a,#963d35);color:#faeedb;box-shadow:0 6px 14px #782e2515}
.member-card-identity{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:0.5px solid #f0d3ad30}
.member-card-avatar{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:39px;height:39px;border-radius:50%;background:#f4e5cd;color:#79382e;font-family:serif;font-size:21px}
.member-card-person{flex:1;min-width:0}.member-card-name{display:block;font-size:17px;font-weight:600;color:#fff2df;line-height:1.4;overflow-wrap:break-word}.member-card-phone{display:block;margin-top:4px;font-size:11px;line-height:1.5;color:#e4c5b1}
.member-card-level{flex-shrink:0;max-width:90px;padding:4px 7px;border:0.5px solid #e8c38b55;border-radius:12px;background:#f5dca513;color:#f3d9aa;font-size:10px;line-height:1.5;overflow-wrap:break-word}
.member-card-balance{position:relative;z-index:1;padding-top:15px}.member-card-caption{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#e8c8ac;font-size:11.5px}.member-card-brand{font-family:serif;font-size:11px;letter-spacing:2px}.member-card-amount{display:block;margin-top:9px;color:#fff2df;font-size:38px;font-weight:500;line-height:1.25;letter-spacing:0.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.member-card-ring{position:absolute;right:-130px;top:-50px;width:220px;height:220px;border:0.5px solid #d6ad7540;border-radius:50%;box-shadow:0 0 0 20px #d6ad7509,0 0 0 40px #d6ad7508;pointer-events:none}
</style></head><body><main class="preview"><p class="note">小程序现有会员卡 · 修改后<br>以下姓名、等级和余额为演示数据</p><div class="page"><div class="title">我的</div><div class="card member-card"><div class="member-card-identity"><div class="member-card-avatar"><span>茶</span></div><div class="member-card-person"><span class="member-card-name">示例会员</span><span class="member-card-phone">138 **** 0000</span></div><span class="member-card-level">八马会员</span></div><div class="member-card-balance"><div class="member-card-caption"><span>账户余额（元）</span><span class="member-card-brand">八马茶业</span></div><span class="member-card-amount">1280.00</span></div><div class="member-card-ring"></div></div></div></main></body></html>
