<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预约提醒样式预览</title><style>*{box-sizing:border-box}body{margin:0;background:#ece8e1;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}main{max-width:375px;margin:32px auto}button{font-family:inherit;cursor:pointer}header{font-size:12px;color:#887460;padding:0 16px 14px;line-height:1.7}.screen-title{padding:14px;text-align:center;background:#fff8f0;font-size:15px}
.page{min-height:100vh;background:#faf7f2;padding:16px 16px 85px;color:#352a24}.page-heading{margin:5px 0 15px}.page-title{display:block;font-size:22px;font-weight:650;letter-spacing:0.5px}.page-subtitle{display:block;color:#8d8176;font-size:12px;margin-top:6px}.branch-card{display:flex;align-items:center;gap:9px;background:#fff;padding:12px;border:0.5px solid #eee5dc;border-radius:11px}.store-mark{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff0e4;color:#b9442e;border-radius:8px;font-size:14px}.branch-copy{flex:1;min-width:0}.branch-name{font-size:13.5px;font-weight:600;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.branch-address{font-size:10.5px;color:#92867b;display:block;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.branch-switch{font-size:11px;color:#a55f45;flex-shrink:0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:17px 0 10px;font-size:14.5px;font-weight:600}.section-hint{font-size:10.5px;color:#94877d;font-weight:400}.datechips{white-space:nowrap}.datechip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:9px 5px 6px;margin-right:7px;background:#fff;border:0.5px solid #eee5dc;border-radius:9px}.datechip:last-child{margin-right:0}.date-label{font-size:10.5px;color:#8b7f75}.date-number{font-size:15px;font-weight:600;margin-top:5px}.date-dot{width:3px;height:3px;border-radius:50%;background:transparent;margin-top:5px}.datechip.sel{background:#fff0e6;border-color:#dc714b;color:#ae3928}.sel .date-label{color:#b55a3f}.sel .date-dot{background:#c95332}.room{background:#fff;border:0.5px solid #ece5de;border-radius:12px;margin-bottom:10px;overflow:hidden}.room.expanded{border-color:#d98565;box-shadow:0 5px 17px #a8452210}.room-head{display:flex;gap:11px;padding:12px;align-items:center}.thumbnail{height:75px;width:71px;flex-shrink:0;border-radius:8px;overflow:hidden;background:#f7ebe0}.thumbnail image{width:100%;height:100%}.room-placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8ebd9,#f4d9c3)}.room-number{font-size:24px;color:#b78a67;font-family:Georgia,serif}.room-type{font-size:10px;color:#9c7255;letter-spacing:2px;margin-top:4px}.room-info{flex:1;min-width:0}.room-name{font-size:15.5px;font-weight:600;display:block}.room-detail{display:block;font-size:11px;color:#938679;margin-top:6px}.room-bottom{display:flex;justify-content:space-between;align-items:baseline;gap:5px;margin-top:10px}.price{color:#b73d2d;font-size:16.5px;font-weight:600}.unit{font-size:9.5px;color:#9a8b7d;font-weight:400}.select-room{font-size:10.5px;color:#b45235;white-space:nowrap}.booking-panel{padding:0 12px 13px}.facilities{display:block;font-size:10.5px;color:#948478;padding-bottom:8px}.time-row{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:0.5px solid #f0e8df}.time-control{flex:1;min-width:0}.time-box{background:#faf7f3;border:0.5px solid #eae1d7;border-radius:8px;padding:10px}.time-label{display:block;font-size:10px;color:#8a7c70}.time-value{font-size:19px;font-weight:500;display:flex;align-items:center;justify-content:space-between;margin-top:5px;font-variant-numeric:tabular-nums}.chevron{font-size:12px;color:#b17f62}.time-separator{color:#c8b7a6}.time-note{display:block;font-size:10px;color:#9b8a7b;margin:9px 0 12px}.checkout{display:flex;align-items:center;justify-content:space-between;gap:10px}.total-label{display:block;font-size:10.5px;color:#92806f}.total-price{display:block;font-size:20px;font-weight:600;color:#b5362d;margin-top:3px}.book{margin:0;width:130px;background:linear-gradient(105deg,#bb382a,#da6338);color:white;font-size:13.5px;border-radius:7px;line-height:44px;padding:0}.book[disabled]{background:#eee4dc;color:#a69586;opacity:1}.empty{padding:12px 0;color:#978676;text-align:center;font-size:12px}.footnote{display:block;text-align:center;color:#ab9b8c;font-size:10.5px;margin:16px 0}
.occupancy{margin:0 12px 11px;padding-top:9px;border-top:0.5px solid #f2eae2}.occupancy-heading{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#897669;margin-bottom:7px}.occupancy-date{font-size:9.5px;color:#ad9b8c}.occupancy-list{display:flex;flex-wrap:wrap;gap:6px}.occupancy-chip{display:flex;align-items:center;gap:5px;background:#fff0e8;color:#a6472e;border:0.5px solid #f0d6c6;padding:6px 8px;border-radius:5px;font-size:11.5px;font-variant-numeric:tabular-nums}.occupancy-kind{font-size:9.5px;color:#a97058}.occupancy-dot{width:4px;height:4px;display:block;border-radius:50%;background:#ce6946}.occupancy-chip.closed{background:#f1efed;border-color:#e1dad4;color:#807165}.closed .occupancy-dot{background:#9d8e83}.closed .occupancy-kind{color:#94877b}.occupancy-note{font-size:10.5px;color:#9b8879;line-height:1.7}.occupancy-error{font-size:10.5px;color:#b95138;padding:4px 0}
.approval-note{display:block;color:#b15b3d;background:#fff2e7;padding:8px;border-radius:5px;font-size:11px;line-height:1.6;margin-bottom:11px}
.booking-notice{margin:10px 0 0;padding:12px;box-sizing:border-box;border:0.5px solid #ebe1d4;border-radius:10px;background:#f6f0e7}
.notice-main{display:flex;align-items:center;gap:8px}.notice-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:26px;height:30px;color:#a07850}.notice-bell{position:relative;width:13px;height:15px;border:1px solid currentColor;border-radius:8px 8px 2.5px 2.5px}.notice-bell::before{content:'';position:absolute;top:-3.5px;left:4.5px;width:2px;height:2.5px;border-radius:1.5px;background:currentColor}.notice-bell::after{content:'';position:absolute;bottom:-4px;left:4px;width:3.5px;height:2px;border-radius:0 0 3px 3px;background:currentColor}
.notice-copy{flex:1;min-width:0}.notice-title{display:block;font-size:13px;font-weight:600;line-height:1.5;color:#574432}.notice-description{display:block;margin-top:2.5px;font-size:10.5px;line-height:1.6;color:#887460}
.notice-subscribe{flex-shrink:0;margin:0;padding:0 10px;line-height:31px;border:0.5px solid #d9bea0;border-radius:16px;background:#fffaf3;color:#905331;font-size:11.5px;font-weight:500}.notice-subscribe::after,.notice-settings::after{border:0}.notice-subscribe[disabled]{background:#eee7dd;border-color:#dfd4c5;color:#a18c76}
.notice-hint{display:block;margin-top:9px;padding-top:7px;border-top:0.5px solid #e8ded0;font-size:10px;line-height:1.6;color:#918170}
.notice-failure{margin-top:8px;padding:8px 9px;background:#fff5ee;border:0.5px solid #edd5c5;border-radius:6px}.notice-failure text{display:block;font-size:11px;line-height:1.7;color:#a45136}.notice-settings{margin:5px 0 0;padding:4px 0;background:transparent;border:0;text-align:left;font-size:11.5px;line-height:1.6;color:#91442e}


.contact-form{border-top:0.5px solid #eee2d7;padding-top:12px;margin:4px 0 12px}.contact-title{font-size:14px;font-weight:600;display:block;color:#584134}.contact-hint{font-size:10.5px;color:#9a8879;line-height:1.7;display:block;margin:5px 0 11px}.contact-field{margin-bottom:11px;font-size:12px;color:#735b49}.contact-field:last-child{margin-bottom:0}.required{color:#c04c34}.optional{color:#ac9b8c;font-size:10.5px;margin-left:5px}.contact-field input,.contact-field textarea{display:block;width:100%;box-sizing:border-box;background:#faf7f3;border:0.5px solid #eae1d7;border-radius:6px;padding:9px 10px;font-size:12.5px;color:#483628;margin-top:6px}.contact-field input{height:42px}.contact-field textarea{height:77px;line-height:1.7}.remark-count{font-size:9.5px;color:#ac9b8c;display:block;text-align:right;margin-top:4px}


.reservation-modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:14px}
.reservation-mask{position:absolute;inset:0;background:#2e201b80}
.reservation-sheet{position:relative;width:100%;max-width:340px;max-height:92vh;background:#fffaf4;border-radius:15px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 50px #26120f40}
.sheet-header{padding:14px 14px 11px;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid #eee1d4;flex-shrink:0}
.sheet-title{display:block;font-size:17px;font-family:serif;font-weight:600;color:#54392c}.sheet-subtitle{display:block;font-size:10.5px;color:#a18a79;margin-top:4px}
.sheet-close{width:30px;height:30px;line-height:30px;padding:0;margin:0;background:#f7ece1;color:#8c6d58;border-radius:50%;font-size:18px;flex-shrink:0}
.sheet-body{min-height:0;max-height:65vh;box-sizing:border-box;padding:12px 14px;overflow-y:auto;overscroll-behavior:contain}
.booking-summary{background:#fff0e1;border:0.5px solid #f0d8c1;border-radius:9px;padding:11px}.summary-branch{display:block;font-size:10.5px;color:#9d7355}.summary-room{display:block;font-size:14.5px;font-weight:600;margin:4px 0 7px;color:#673f29}.summary-time{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:#815d43;line-height:1.7}.summary-price{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:#b6442f}.edit-time{width:auto;margin:6px 0 0;padding:0;background:transparent;text-align:left;color:#a97550;font-size:10.5px;line-height:1.8}
.sheet-footer{padding:11px 14px;padding-bottom:calc(11px + env(safe-area-inset-bottom));display:flex;gap:9px;border-top:0.5px solid #eee1d4;background:#fffaf4;flex-shrink:0}.sheet-footer button{line-height:42px;margin:0;border-radius:7px;font-size:12.5px}.sheet-cancel{width:75px;background:#f4e9dd;color:#8e7059;flex-shrink:0}.sheet-submit{flex:1;background:linear-gradient(110deg,#bd3b2c,#dc6639);color:white}
.reservation-sheet .contact-form{border-top:0;margin:0 0 10px}.reservation-sheet .contact-title{display:none}.reservation-sheet .contact-hint{margin-top:0;font-size:10px}.reservation-sheet .contact-field{margin-bottom:9px}.reservation-sheet .contact-field input{height:37px}.reservation-sheet .contact-field textarea{height:56px}.reservation-sheet .approval-note{margin-bottom:0}


.guest-field{display:flex;align-items:center;justify-content:space-between;gap:8px}.guest-stepper{display:flex;align-items:center;gap:4px;border:0.5px solid #eadccc;background:#fff;border-radius:6px;padding:2px;flex-shrink:0}.guest-stepper button{width:27px;height:29px;line-height:29px;padding:0;margin:0;border-radius:4px;font-size:14px;background:#fff0e1;color:#b54b31}.reservation-sheet .guest-stepper input{width:29px;height:29px;padding:0;margin:0;border:0;background:transparent;border-radius:0;text-align:center;font-size:13px}.guest-stepper>text{font-size:10.5px;color:#947b67;margin-right:3px}


.booking-error{display:block;flex-shrink:0;margin:0 14px;padding:9px 10px;background:#fff0e8;border:0.5px solid #edc4b5;border-radius:6px;color:#ad3828;font-size:11.5px;line-height:1.6}.result-body{padding:6px 16px 14px;display:flex;flex-direction:column;gap:10px;color:#735b49;font-size:12.5px;line-height:1.8}
.page{min-height:0;padding-bottom:26px}</style></head><body><main><header>订房页 · 提醒入口优化<br>演示门店与日期，仅用于查看样式</header><div class="screen-title">茶室预定</div><div class="page"><div class="page-heading"><span class="page-title">预订茶室</span><span class="page-subtitle">选一间喜欢的，坐一会儿。</span></div><div class="branch-card"><div class="store-mark">店</div><div class="branch-copy"><span class="branch-name">八马茶业 · 演示门店</span><span class="branch-address">选择您要前往的分店</span></div><span class="branch-switch">切换 ›</span></div><div class="booking-notice"><div class="notice-main"><div class="notice-icon" aria-hidden="true"><div class="notice-bell"></div></div><div class="notice-copy"><span class="notice-title">预约成功提醒</span><span class="notice-description">店员确认后，微信及时提醒</span></div><button class="notice-subscribe" onclick="document.getElementById('preview-note').hidden=false">订阅提醒</button></div><span class="notice-hint">自愿订阅，不影响预约 · 次数用完可再次订阅</span><span id="preview-note" hidden style="font-size:11px;color:#887460">此处为样式预览，实际订阅请在微信中操作。</span></div><div class="section-title"><span>到店日期</span><span class="section-hint">可预约未来 5 天</span></div><div class="datechips"><div class="datechip sel"><span class="date-label">今天</span><span class="date-number">9/11</span><div class="date-dot"></div></div><div class="datechip "><span class="date-label">明天</span><span class="date-number">9/12</span><div class="date-dot"></div></div><div class="datechip "><span class="date-label">周日</span><span class="date-number">9/13</span><div class="date-dot"></div></div><div class="datechip "><span class="date-label">周一</span><span class="date-number">9/14</span><div class="date-dot"></div></div><div class="datechip "><span class="date-label">周二</span><span class="date-number">9/15</span><div class="date-dot"></div></div></div><div class="section-title"><span>选择包间</span><span class="section-hint">1 间包间</span></div><div class="room"><div class="room-head"><div class="thumbnail"><div class="room-placeholder"><span class="room-number">01</span><span class="room-type">包厢</span></div></div><div class="room-info"><span class="room-name">听雨阁</span><span class="room-detail">6 · 1 小时起订</span><div class="room-bottom"><span class="price">¥100<span class="unit"> / 小时</span></span><span class="select-room">选时间 ＋</span></div></div></div></div></div></main></body></html>
