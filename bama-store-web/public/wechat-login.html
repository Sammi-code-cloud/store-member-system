<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>微信登录 · 八马门店</title><style>body{font-family:system-ui,sans-serif;background:#fff7ef;color:#463129;padding:32px;margin:0}main{max-width:380px;margin:40px auto;background:white;border:1px solid #efdfd0;border-radius:20px;padding:28px}h1{font-size:24px}p{font-size:14px;line-height:1.8;color:#847363}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;margin-top:12px;border:1px solid #e9dace;font-size:15px}button{background:#bb3b2b;color:white;cursor:pointer}label{display:block;font-size:14px;margin-top:12px}</style><main><h1>微信登录</h1><p id="message" role="status">正在连接微信…</p><form id="binding" hidden><p>首次使用微信登录员工端，请验证已有员工账号。绑定不会增加账号权限。</p><label>员工手机号<input name="phone" autocomplete="username" maxlength="20" required></label><label>员工密码<input name="password" type="password" autocomplete="current-password" maxlength="64" required></label><button>验证并绑定微信</button></form><button id="close" type="button">关闭窗口</button></main><script src="./wechat-callback.js"></script></html>
